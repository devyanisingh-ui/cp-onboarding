<text x="70" y="348" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Subject: Notice of termination — agreement AGR-ASU-2026-XXXX</text>
<g transform="translate(0 386)"><text x="70" y="0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1e293b">This is to notify you that Apeejay Stya University is terminating the Channel</text><text x="70" y="22" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1e293b">Partner Agreement AGR-ASU-2026-XXXX dated 19 October 2026 under its termination</text><text x="70" y="44" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1e293b">clause, for the reason below.</text><text x="70" y="80" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1e293b">Reason: Breach: fees collected from applicants, contrary to clause 6 of the</text><text x="70" y="102" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1e293b">agreement.</text><text x="70" y="138" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1e293b">The agreement ends on 27 November 2026, after 30 days&#39; notice. Until then please</text><text x="70" y="160" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1e293b">complete applications already in progress; no new applications may be sourced on</text><text x="70" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1e293b">our behalf. Commission due for admissions confirmed before that date will be</text><text x="70" y="204" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1e293b">settled as per the agreement.</text><text x="70" y="240" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1e293b">Please return any brochures, branding material and applicant records belonging to</text><text x="70" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1e293b">the institution by the same date.</text>