# Local MySQL for development and the server tests: `npm run db:up`.
# Matches production (Amazon RDS for MySQL 8.4). Credentials are for this machine only.
# A fixed project name, so the container is always cp-onboarding-mysql-1 whatever the folder is called.
name: cp-onboarding

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local
      MYSQL_DATABASE: cp_onboarding
      MYSQL_USER: cp
      MYSQL_PASSWORD: cp_local
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot_local']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
